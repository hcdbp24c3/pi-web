name: Auto-build Pi Web

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if versions unchanged"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ghcr.io/<owner>/pi-web

jobs:
  check:
    name: Check for new versions
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      pi_web_version: ${{ steps.versions.outputs.pi_web_version }}
      pi_agent_version: ${{ steps.versions.outputs.pi_agent_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest versions from npm
        id: versions
        run: |
          PI_WEB=$(npm view @agegr/pi-web version)
          PI_AGENT=$(npm view @earendil-works/pi-coding-agent version)
          echo "pi_web_version=$PI_WEB" >> "$GITHUB_OUTPUT"
          echo "pi_agent_version=$PI_AGENT" >> "$GITHUB_OUTPUT"
          echo "Latest pi-web: $PI_WEB"
          echo "Latest pi-agent: $PI_AGENT"

      - name: Compare with last built versions
        id: compare
        run: |
          FORCE="${{ github.event.inputs.force }}"
          PI_WEB="${{ steps.versions.outputs.pi_web_version }}"
          PI_AGENT="${{ steps.versions.outputs.pi_agent_version }}"

          # Read last-built versions from committed VERSIONS file (if present)
          LAST_WEB=""
          LAST_AGENT=""
          if [ -f VERSIONS ]; then
            LAST_WEB=$(grep -E '^PI_WEB=' VERSIONS | cut -d= -f2 || true)
            LAST_AGENT=$(grep -E '^PI_AGENT=' VERSIONS | cut -d= -f2 || true)
          fi

          echo "Last built: pi-web=$LAST_WEB, pi-agent=$LAST_AGENT"
          echo "Latest:     pi-web=$PI_WEB, pi-agent=$PI_AGENT"

          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PI_WEB" != "$LAST_WEB" ] || [ "$PI_AGENT" != "$LAST_AGENT" ]; then
            echo "New version detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No version change. Skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & push multi-arch image
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to commit updated VERSIONS file
      packages: write        # to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.check.outputs.pi_web_version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PI_WEB_VERSION=${{ needs.check.outputs.pi_web_version }}
            PI_AGENT_VERSION=${{ needs.check.outputs.pi_agent_version }}
          # GitHub Actions cache: reuse layers between runs (free, per-repo)
          # mode=max caches ALL layers, not just the final one — so apt/nodejs/
          # bun/pi layers are reused even when the npm install layer changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record built versions
        run: |
          printf 'PI_WEB=%s\nPI_AGENT=%s\n' \
            "${{ needs.check.outputs.pi_web_version }}" \
            "${{ needs.check.outputs.pi_agent_version }}" > VERSIONS
          cat VERSIONS

      - name: Commit updated VERSIONS
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump built versions to pi-web ${{ needs.check.outputs.pi_web_version }} / pi-agent ${{ needs.check.outputs.pi_agent_version }}"
          file_pattern: VERSIONS
